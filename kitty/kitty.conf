# ~/.config/kitty/kitty.conf

# ===== 폰트 =====
font_family D2Coding
font_size 12

# ===== 창 패딩 (위/오/아래/왼쪽) =====
# ghostty: window-padding-x = 20,20 / window-padding-y = 20,20
# kitty는 px 단위. 대략 비슷하게 맞춤.
window_padding_width 20

# ==== 라인 패딩 ====
modify_font cell_height 3px

# ===== 테마 (Catppuccin Latte 비슷하게) =====
# 여기선 기본값을 쓰고, 테마는 별도 include로 분리하는 방식 추천.
# catppuccin-kitty 테마 설치했다는 가정 하에:
include theme.conf

# ===== 키바인딩 (ctrl+a = select_all) =====
# kitty: select_all 동작은 없고, 전체 선택은 보통 ctrl+shift+a 같은 식으로 매핑.
# 여기에선 ghostty 그대로 최대한 근접하게 구현:
map ctrl+a copy_or_select_all

# ===== 창 닫기 확인 (confirm-close-surface = false 비슷하게) =====
# kitty는 기본적으로 "정말 닫을까요?" 팝업이 없음.
# 그나마 비슷한 건 종료 확인 관련 옵션인데, 보통 끄는 쪽이 ghostty 설정과 유사.
confirm_os_window_close 0

# 폰트 키우기 / 줄이기
map ctrl+equal  change_font_size all +2.0
map ctrl+minus change_font_size all -2.0

# (선택) 기본 크기로 리셋
map ctrl+0 change_font_size all 0

touch_scroll_multiplier 5.0

# ===== 커서 =====
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# ===== 스크롤백 버퍼 =====
scrollback_lines 10000

# ===== URL 클릭 =====
detect_urls yes
url_style curly
open_url_with default

# ===== 탭 =====
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{cwd}"

# ===== 벨 끄기 =====
enable_audio_bell no
visual_bell_duration 0

# ===== 성능 =====
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ===== 클립보드 =====
copy_on_select clipboard
strip_trailing_spaces smart

# ===== 마우스 =====
mouse_hide_wait 3.0

# 탭 이동 (ctrl+shift + 번호)
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
