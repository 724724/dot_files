#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)

exec-once = nm-applet & blueman-applet
exec-once = fcitx5 &
exec-once = ~/.config/hypr/scripts/wallpaper.sh
exec-once = hypridle
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = env __EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json VK_DRIVER_FILES=/usr/share/vulkan/icd.d/intel_icd.x86_64.json swaync
exec-once = wl-clip-persist --clipboard regular
exec-once = swayosd-server -s ~/.config/swayosd/style.css
exec-once = hyprshell run &
exec-once = xembedsniproxy
exec-once = pactl set-source-mute @DEFAULT_SOURCE@ 0
#exec-once = ~/.config/hypr/scripts/hdmi-audio.sh
exec = ~/.config/hypr/scripts/lid.sh init

# gdrive
exec-once = sleep 5 && rclone mount gdrive: /mnt/gdrive --vfs-cache-mode full --vfs-cache-max-size 50G --vfs-cache-max-age 72h --dir-cache-time 72h --buffer-size 128M --vfs-read-chunk-size 128M --vfs-fast-fingerprint --daemon
