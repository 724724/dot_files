#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)

exec-once = nm-applet & blueman-applet
exec-once = fcitx5 &
exec-once = ~/.config/hypr/scripts/wallpaper.sh
exec-once = ~/.config/hypr/scripts/hide-unplugged-sinks.sh &
exec-once = hypridle
exec-once = wl-clip-persist --clipboard regular
exec-once = xembedsniproxy
exec-once = pactl set-source-mute @DEFAULT_SOURCE@ 0
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd --all
exec = ~/.config/hypr/scripts/lid.sh init
exec-once = env QT_FONT_DPI=80 qs -c desktop
exec-once = wineserver -p
exec-once = hyprsunset
exec-once = systemctl --user start graphical-session.target
exec-once = sleep 5 && sudo pkill sddm-greeter

# gdrive
exec-once = sleep 5 && rclone mount gdrive: /mnt/gdrive --vfs-cache-mode full --vfs-cache-max-size 50G --vfs-cache-max-age 72h --dir-cache-time 72h --buffer-size 128M --vfs-read-chunk-size 128M --vfs-fast-fingerprint --daemon
