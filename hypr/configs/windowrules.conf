##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# -----------------------------------------------------
# Opacity Rules
# -----------------------------------------------------
windowrule = opacity 1.0 override, match:title (.*(YouTube|HBO|Prime Video|Netflix|Disney|Twitch|Kick).*)
windowrule = opacity 1.0 override, match:class ^(google-chrome)$
windowrule = opacity 1.0 override, match:class ^(firefox)$
windowrule = opacity 1.0 override, match:class ^(org.gnome.Showtime)$
windowrule = opacity 1.0 override, match:class ^(virt-manager)$
windowrule = opacity 1.0 override, match:class ^(kakaotalk.exe)$
windowrule = opacity 1.0 override, match:class ^(resolve)$
windowrule = opacity 1.0 override, match:class ^(Notion)$

# -----------------------------------------------------
# Floating & PIP
# -----------------------------------------------------

# Notion Command Search (Spotlight style)
windowrule = float on, match:title ^(Notion - Command Search)$
# Note: "move cursor" is replaced by math. Adjusted to offset slightly from cursor.
windowrule = move (cursor_x-(window_w*0.95)) (cursor_y+(window_h*0.05)), match:title ^(Notion - Command Search)$

# Picture-in-Picture
windowrule = float on, pin on, keep_aspect_ratio on, opacity 1.0 override, match:title ^(Picture-in-Picture|Picture in picture)$

# Sticky Notes
windowrule = float on, size 400 300, match:class ^(com.vixalien.sticky)$

# Spotify Premium
windowrule = float on, size 1000 600, match:class ^(spotify)$, match:title ^(Spotify Premium)$
# Center on cursor
windowrule = move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:class ^(spotify)$, match:title ^(Spotify Premium)$

# -----------------------------------------------------
# Dialogs & Popups (Center on Cursor)
# -----------------------------------------------------
# Helper var for centering: (cursor_x - w/2) (cursor_y - h/2)

windowrule = float on, match:class ^(org.gnome.clocks)$, match:title ^(Clocks)$
windowrule = float on, match:class ^(blueman-manager)$, match:title ^(Bluetooth Devices)$
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$, match:title ^(Volume Control)$

windowrule = float on, match:class org.gnome.Nautilus
windowrule = move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:class ^(org.gnome.Nautilus)$

windowrule = float on, match:class ^(org.gnome.Calculator)$, match:title ^(Calculator)$
windowrule = move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:class ^(org.gnome.Calculator)$, match:title ^(Calculator)$

windowrule = float on, match:title ^(Open Folder)$

windowrule = float on, match:class ^(org.gnome.SystemMonitor)$, match:title ^(System Monitor)$
windowrule = move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:class ^(org.gnome.SystemMonitor)$, match:title ^(System Monitor)$

windowrule = float on, match:class ^(me.kavishdevar.librepods)$, match:title ^(LibrePods)$
windowrule = move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:class ^(me.kavishdevar.librepods)$, match:title ^(LibrePods)$

windowrule = float on, match:class ^(anki)$
windowrule = float on, match:class ^(GStreamer)$

windowrule = float on, match:class ^(org.gnome.Solanum)$
windowrule = move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:class ^(org.gnome.Solanum)$

windowrule = float on, match:class ^(vesktop)$
windowrule = move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:class ^(vesktop)$

windowrule = stay_focused on, match:class ^(kakaotalk.exe)$, match:title ^()$
windowrule = stay_focused on, match:class ^(Zoom Workplace)$, match:title ^(menu window|sub menu window)$

# -----------------------------------------------------
# Fixes & Hacks
# -----------------------------------------------------

# KakaoTalk Shadow Window Fix
windowrule = opacity 0.0 override 0.0 override, no_shadow on, no_blur on, no_focus on, no_initial_focus on, match:class ^(kakaotalk.exe)$, match:title ^(KakaoTalkShadowWnd)$
windowrule = opacity 0.0 override 0.0 override, no_shadow on, no_blur on, no_focus on, no_initial_focus on, match:class ^(kakaotalk.exe)$, match:title ^(KakaoTalkEdgeWnd)$

# "Winboat" / Office Apps
# suppress_event takes space separated list now
windowrule = suppress_event fullscreen maximize activate activatefocus, match:class ^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$
windowrule = no_initial_focus on, fullscreen on, no_anim on, rounding 0, border_size 0, no_shadow on, no_blur on, xray 0, opaque on, match:class ^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$

windowrule = opaque on, xray 0, match:class ^(wlfreerdp)$

# XWayland Ghost Windows
windowrule = opacity 0.0 override 0.0 override, size 1 1, no_focus on, no_initial_focus on, no_shadow on, no_blur on, border_size 0, match:xwayland 1, match:class ^$, match:title ^$

# -----------------------------------------------------
# Layer Rules
# -----------------------------------------------------

layerrule = no_anim on, match:namespace hyprpicker
layerrule = no_anim on, match:namespace selection

# Waybar & Notifications
layerrule = blur on, ignore_alpha 0.25, match:namespace waybar

layerrule = animation slide right, blur on, ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = animation slide right, blur on, ignore_alpha 0.5, match:namespace swaync-notification-window

# Rofi
layerrule = blur on, ignore_alpha 0.5, match:namespace rofi
