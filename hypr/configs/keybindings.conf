###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
$mainMod = SUPER # Sets "Windows" key as main modifier

# Applications
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, ~/.config/rofi/rofi-launch.sh
bind = ALT, SPACE, exec, rofi -show drun -theme ~/.config/rofi/launchpad.rasi
bind = $mainMod, B, exec, pkill -SIGUSR1 waybar
bind = $mainMod CTRL, SPACE, exec, /usr/bin/smile
bind = $mainMod SHIFT, W, exec, looking-glass-client

# System
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow -j | jq '.pid' | xargs kill -9
bind = $mainMod, J, togglesplit
bind = , XF86PowerOff, exec, hyprlock
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, P, togglefloating

# Screenshots
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/shot.sh output
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/shot.sh region
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/winshot.sh

# Special Workspace (Magic)
bind = $mainMod, M, movetoworkspacesilent, special:magic
bind = $mainMod SHIFT, M, togglespecialworkspace, magic

# Focus / Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod ALT, left, movecurrentworkspacetomonitor, +1
bind = $mainMod ALT, right, movecurrentworkspacetomonitor, -1
bind = $mainMod ALT, up, movecurrentworkspacetomonitor, +1
bind = $mainMod ALT, down, movecurrentworkspacetomonitor, -1

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

bind = $mainMod, page_up, workspace, e-1
bind = $mainMod, page_down, workspace, e+1

# Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod SHIFT, right, resizeactive, 50 0
bind = $mainMod SHIFT, left, resizeactive, -50 0
bind = $mainMod SHIFT, up, resizeactive, 0 -50
bind = $mainMod SHIFT, down, resizeactive, 0 50
bind = $mainMod SHIFT, 0, splitratio, exact 1

bind = $mainMod CTRL, left, swapwindow, l
bind = $mainMod CTRL, right, swapwindow, r
bind = $mainMod CTRL, up, swapwindow, u
bind = $mainMod CTRL, down, swapwindow, d

# Media & Brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ ; ags request -i osd "volume:$(wpctl get-volume @DEFAULT_AUDIO_SINK@)"
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- ; ags request -i osd "volume:$(wpctl get-volume @DEFAULT_AUDIO_SINK@)"
bindel = ,XF86AudioMute, exec, ~/.config/hypr/scripts/speaker_mute.sh ; ags request -i osd "volume:$(wpctl get-volume @DEFAULT_AUDIO_SINK@)"
bindel = ,XF86AudioMicMute, exec, ~/.config/hypr/scripts/mic_mute.sh ; ags request -i osd "mic:$(wpctl get-volume @DEFAULT_AUDIO_SOURCE@)"
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ ; ags request -i osd "brightness:$(brightnessctl -m | grep -o '[0-9]*%' | head -1 | tr -d '%')"
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- ; ags request -i osd "brightness:$(brightnessctl -m | grep -o '[0-9]*%' | head -1 | tr -d '%')"
bind = ,XF86Display, exec, hyprctl dispatch dpms toggle eDP-1

bindl = , XF86TouchpadOff, exec, playerctl next
bindl = , XF86Favorites, exec, playerctl play-pause
bindl = , XF86Launch7, exec, playerctl previous

# Lid Switch
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh open
