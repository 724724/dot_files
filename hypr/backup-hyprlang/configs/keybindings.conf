###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
$mainMod = SUPER # Sets "Windows" key as main modifier

# Applications
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, qs ipc -c desktop call spotlight toggle
bind = ALT, SPACE, exec, qs ipc -c desktop call launchpad toggle
bind = $mainMod, B, exec, qs ipc -c desktop call bar toggle
bind = $mainMod CTRL, SPACE, exec, /usr/bin/smile
bind = $mainMod SHIFT, W, exec, looking-glass-client

# System
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow -j | jq '.pid' | xargs kill -9
bind = $mainMod, J, layoutmsg, togglesplit
bind = , XF86PowerOff, exec, hyprlock
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, P, togglefloating
# Overview moved off Super+Tab so the switcher can use it (macOS Cmd+Tab style)
bind = $mainMod, grave, exec, qs ipc -c overview call overview toggle

# ── App Switcher (macOS Cmd+Tab style) ──────────────────────────────────
# Routes to Quickshell's GlobalShortcut (defined in switcher/shell.qml). This
# avoids the bindr/submap fragility — once the switcher window is open it grabs
# keyboard focus via HyprlandFocusGrab + WlrLayershell, so Tab cycles, Esc
# cancels, Enter confirms, and releasing Super confirms — all handled in QML.
bind = $mainMod, TAB, global, switcher:next
bind = $mainMod SHIFT, TAB, global, switcher:prev

# Screenshots
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/shot.sh output
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/shot.sh region
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/winshot.sh

bindl = , Print, exec, grim - | wl-copy && qs ipc -c desktop call osd custom "󰹑" "Screenshot copied to clipboard"

# Special Workspace (Magic)
bind = $mainMod, M, movetoworkspacesilent, special:magic
bind = $mainMod SHIFT, M, togglespecialworkspace, magic

# Focus / Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod ALT, left, movecurrentworkspacetomonitor, +1
bind = $mainMod ALT, right, movecurrentworkspacetomonitor, -1
bind = $mainMod ALT, up, movecurrentworkspacetomonitor, +1
bind = $mainMod ALT, down, movecurrentworkspacetomonitor, -1

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

bind = $mainMod, page_up, workspace, e-1
bind = $mainMod, page_down, workspace, e+1

# Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod SHIFT, right, resizeactive, 50 0
bind = $mainMod SHIFT, left, resizeactive, -50 0
bind = $mainMod SHIFT, up, resizeactive, 0 -50
bind = $mainMod SHIFT, down, resizeactive, 0 50
bind = SUPER SHIFT, 0, layoutmsg, splitratio exact 1.0

bind = $mainMod CTRL, left, swapwindow, l
bind = $mainMod CTRL, right, swapwindow, r
bind = $mainMod CTRL, up, swapwindow, u
bind = $mainMod CTRL, down, swapwindow, d

# Media & Brightness
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume-osd.sh 5%+
bindel = SHIFT, XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume-osd.sh 2%+
bindel = ,XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume-osd.sh 5%-
bindel = SHIFT, XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume-osd.sh 2%-

bindel = ,XF86AudioMute, exec, ~/.config/hypr/scripts/speaker_mute.sh
bindel = ,XF86AudioMicMute, exec, ~/.config/hypr/scripts/mic_mute.sh

bindel = ,XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness-osd.sh raise
bindel = SHIFT, XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness-osd.sh +2
bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness-osd.sh lower
bindel = SHIFT, XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness-osd.sh -2

bindl = , F23, exec, ~/.config/hypr/scripts/media-osd.sh next
bindl = , XF86Favorites, exec, ~/.config/hypr/scripts/media-osd.sh play-pause
bindl = , XF86Launch7, exec, ~/.config/hypr/scripts/media-osd.sh prev

# Keyboard Lock — XF86Display alone toggles. Brightness-down past 0% handles DPMS,
# so the dedicated screen-dim binding is no longer needed.
bind = , XF86Display, exec, qs ipc -c desktop call osd custom "󰌆" "Keyboard Locked"
bind = , XF86Display, submap, locked
submap = locked
bind = , XF86Display, exec, qs ipc -c desktop call osd custom "󰌆" "Keyboard Unlocked"
bind = , XF86Display, submap, reset
# Swallow every key — `, catchall` only matches no-modifier presses, so we have
# to enumerate all 16 modifier combinations to also block Shift+X, Ctrl+X, etc.
bindl =                         , catchall, exec,
bindl = SHIFT                   , catchall, exec,
bindl = CTRL                    , catchall, exec,
bindl = ALT                     , catchall, exec,
bindl = SUPER                   , catchall, exec,
bindl = SHIFT CTRL              , catchall, exec,
bindl = SHIFT ALT               , catchall, exec,
bindl = SHIFT SUPER             , catchall, exec,
bindl = CTRL ALT                , catchall, exec,
bindl = CTRL SUPER              , catchall, exec,
bindl = ALT SUPER               , catchall, exec,
bindl = SHIFT CTRL ALT          , catchall, exec,
bindl = SHIFT CTRL SUPER        , catchall, exec,
bindl = SHIFT ALT SUPER         , catchall, exec,
bindl = CTRL ALT SUPER          , catchall, exec,
bindl = SHIFT CTRL ALT SUPER    , catchall, exec,
submap = reset

# Night Shift - Hyprsunset toggle
bindl = $mainMod SHIFT, XF86MonBrightnessUp, exec, hyprctl hyprsunset temperature 4500 && qs ipc -c desktop call osd custom "󰃟" "Blue Light Filter ON"
bindl = $mainMod SHIFT, XF86MonBrightnessDown, exec, hyprctl hyprsunset identity && qs ipc -c desktop call osd custom "󰃠" "Blue Light Filter OFF"

# Lid Switch
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh close
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh open
