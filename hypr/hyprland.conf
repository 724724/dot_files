#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 1

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    #col.inactive_border = rgba(595959aa)
    col.active_border = rgba(1e293bee) rgba(020617ee) 45deg
    col.inactive_border = rgba(27272faa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    
    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 3
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.95

    dim_special = 0.7

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 6
        passes = 2
	new_optimizations = true
    	xray = false
    	ignore_opacity = true
    }
}

#windowrulev2 = opacity 0.8 override 0.75 override 1.0 override, class: firefox
windowrulev2 = opacity 1.0 override, title: (.*YouTube.*)
windowrulev2 = opacity 1.0 override, title: (.*HBO.*)
windowrulev2 = opacity 1.0 override, title: (.*Prime Video.*)
windowrulev2 = opacity 1.0 override, title: (.*Netflix.*)
windowrulev2 = opacity 1.0 override, title: (.*Disney.*)
windowrulev2 = opacity 1.0 override, title: (.*Twitch.*)
windowrulev2 = opacity 1.0 override, title: (.*Kick.*)
windowrulev2 = opacity 1.0 override, title: ^Picture-in-Picture$
windowrulev2 = opacity 1.0 override, class:^(google-chrome)$
windowrulev2 = opacity 1.0 override, class:^(firefox)$
windowrulev2 = opacity 1.0 override, class:^(org.gnome.Showtime)$
windowrulev2 = opacity 1.0 override, class:^(virt-manager)$
windowrulev2 = opacity 1.0 override, class:^(kakaotalk.exe)$
windowrulev2 = opacity 1.0 override, class:^(resolve)$

windowrulev2 = opacity 1.0 override, class:^(Notion)$ 
windowrulev2 = float, title:^(Notion - Command Search)$
windowrulev2 = move cursor -95% 5%, title:^(Notion - Command Search)$

# 1. 둥둥 떠있게 + 핀 고정 (워크스페이스 따라오기)
windowrulev2 = float, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = pin, title:^(Picture-in-Picture|Picture in picture)$
# 2. 비율 고정 (검정 박스 방지 - 이게 핵심입니다!)
# 창 크기를 조절할 때 영상의 원본 비율을 유지합니다.
windowrulev2 = keepaspectratio, title:^(Picture-in-Picture|Picture in picture)$
# 3. 불투명도 및 위치 (기존 유지)
windowrulev2 = opacity 1.0 override, title:^(Picture-in-Picture|Picture in picture)$

windowrulev2 = float, class:^(com.vixalien.sticky)$

windowrulev2 = float, class:^(spotify)$,title:^(Spotify Premium)$
windowrulev2 = size 1000 600, class:^(spotify)$,title:^(Spotify Premium)$
windowrulev2 = move cursor -50% -50%, class:^(spotify)$,title:^(Spotify Premium)$

windowrulev2 = float, class:^(org.gnome.clocks)$,title:^(Clocks)$
windowrulev2 = float, class:^(blueman-manager)$,title:^(Bluetooth Devices)$

windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)$, title:^(Volume Control)$

windowrulev2 = float,class:^(org.gnome.Nautilus)$
windowrulev2 = move cursor -50% -50%,class:^(org.gnome.Nautilus)$

windowrulev2 = float,class:^(org.gnome.Calculator)$, title:^(Calculator)$
windowrulev2 = move cursor -50% -50%,class:^(org.gnome.Calculator)$, title:^(Calculator)$

windowrulev2 = float,title:^(Open Folder)$

windowrulev2 = float,class:^(org.gnome.SystemMonitor)$,title:^(System Monitor)$
windowrulev2 = move cursor -50% -50%,class:^(org.gnome.SystemMonitor)$,title:^(System Monitor)$

windowrulev2 = float,class:^(me.kavishdevar.librepods)$,title:^(LibrePods)$
windowrulev2 = move cursor -50% -50%,class:^(me.kavishdevar.librepods)$,title:^(LibrePods)$

windowrulev2 = float,class:^(anki)$
windowrulev2 = float,class:^(GStreamer)$

windowrulev2 = float,class:^(org.gnome.Solanum)$
windowrulev2 = move cursor -50% -50%,class:^(org.gnome.Solanum)$

windowrulev2 = float,class:^(vesktop)$
windowrulev2 = move cursor -50% -50%,class:^(vesktop)$

# KakaoTalk Shadow Window Fix
# 1. 완전 투명화 (보이지 않게)
windowrulev2 = opacity 0.0 override 0.0 override, class:^(kakaotalk.exe)$, title:^(KakaoTalkShadowWnd)$
# 2. Hyprland 자체 그림자 및 블러 제거
windowrulev2 = noshadow, class:^(kakaotalk.exe)$, title:^(KakaoTalkShadowWnd)$
windowrulev2 = noblur, class:^(kakaotalk.exe)$, title:^(KakaoTalkShadowWnd)$
# 3. 포커스 방지 (알림 떴을 때 키보드 입력 뺏기지 않게)
windowrulev2 = nofocus, class:^(kakaotalk.exe)$, title:^(KakaoTalkShadowWnd)$
windowrulev2 = noinitialfocus, class:^(kakaotalk.exe)$, title:^(KakaoTalkShadowWnd)$

# winboat
windowrulev2 = suppressevent fullscreen maximize activate activatefocus, class:^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$ 
windowrulev2 = noinitialfocus, class:^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$ 
windowrulev2 = fullscreen, class:^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$ 
windowrulev2 = noanim, class:^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$ 
windowrulev2 = norounding, class:^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$ 
windowrulev2 = noborder, class:^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$ 
windowrulev2 = noshadow, class:^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$ 
windowrulev2 = noblur, class:^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$ 
windowrulev2 = xray 0, class:^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$ 
windowrulev2 = opaque, class:^(Microsoft Word|Microsoft Excel|Microsoft PowerPoint|Photoshop|File Explorer)$ 
windowrulev2 = opaque, class:^(wlfreerdp)$ 
windowrulev2 = xray 0, class:^(wlfreerdp)$

# no border line in hypershot
layerrule = noanim, hyprpicker
layerrule = noanim, selection

# waybar glass
layerrule = blur, waybar
layerrule = ignorezero, waybar

# swaync animation
layerrule = animation slide right, swaync-control-center
layerrule = animation slide right, swaync-notification-window

# Control Center (알림 센터) 블러 설정
layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-control-center

# Notification Window (팝업 알림) 블러 설정
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-notification-window

# rofi theme
layerrule = blur, rofi
layerrule = ignorezero, rofi

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 3, overshot, slide
    animation = windowsOut, 1, 3, smoothOut, slide
    animation = windowsMove, 1, 3, default
    animation = border, 1, 3, default
    animation = fade, 1, 3, smoothIn
    animation = fadeDim, 1, 3, smoothIn
    animation = workspaces, 1, 3, default
    animation = layers, 1, 3, default, slide right
    animation = specialWorkspace, 1, 5, default, slidevert 50%
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = altwin:swap_alt_win
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
	disable_while_typing = true
	tap-to-click = false
    }
}

cursor {
    inactive_timeout = 3
    no_hardware_cursors = 0
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = logitech-mx-master-3s
    scroll_factor = 1.0        # 방향 뒤집고 싶으면 -1.0
    natural_scroll = true     # 터치패드처럼 ‘자연 스크롤’ 원하면 이걸 켜고 위는 1.0 유지
}

device {
    name = tpps/2-elan-trackpoint
    sensitivity = -0.5
}
    
device {
	name = syna800e:00-06cb:ce67-touchpad
	sensitivity = 0.15
	scroll_factor = 0.4
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow -j | jq '.pid' | xargs kill -9
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, SPACE, exec, ~/.config/rofi/rofi-launch.sh
bind = $mainMod, J, togglesplit, # dwindle

bind = , XF86PowerOff, exec, hyprlock
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, P, togglefloating

bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/shot.sh output
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/shot.sh region
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/winshot.sh

bind = $mainMod, B, exec, pkill -SIGUSR1 waybar

# 1. 현재 창을 숨기기 (맥의 Cmd+M 역할)
# 선택한 창을 'magic'이라는 이름의 특수 공간으로 보냅니다.
bind = $mainMod, M, movetoworkspacesilent, special:magic
# 2. 숨긴 창 다시 불러오기 / 숨기기 (토글)
# 'magic' 공간에 있는 창들을 현재 화면 위로 불러오거나 다시 숨깁니다.
bind = $mainMod SHIFT, M, togglespecialworkspace, magic

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod ALT, left, movecurrentworkspacetomonitor, +1
bind = $mainMod ALT, right, movecurrentworkspacetomonitor, -1
bind = $mainMod ALT, up, movecurrentworkspacetomonitor, +1
bind = $mainMod ALT, down, movecurrentworkspacetomonitor, -1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, TAB, togglespecialworkspace, magic
#bind = $mainMod SHIFT, TAB, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
#bind = $mainMod, mouse_down, workspace, e+1
#bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, page_up, workspace, e-1
bind = $mainMod, page_down, workspace, e+1 

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod SHIFT, right, resizeactive, 50 0
bind = $mainMod SHIFT, left, resizeactive, -50 0
bind = $mainMod SHIFT, up, resizeactive, 0 -50
bind = $mainMod SHIFT, down, resizeactive, 0 50

bind = $mainMod CTRL, left, swapwindow, l
bind = $mainMod CTRL, right, swapwindow, r
bind = $mainMod CTRL, up, swapwindow, u
bind = $mainMod CTRL, down, swapwindow, d

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86Favorites, exec, playerctl play-pause
#bindl = , XF86AudioPause, exec, playerctl play-pause
#bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# lid 닫힘(Lid Switch 'on') → 스크립트에 close 전달
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh close
# lid 열림(Lid Switch 'off') → 스크립트에 open 전달
bindl = , switch:off:Lid Switch, exec, ~/.config/hypr/scripts/lid.sh open

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# XWayland 유령 창 처리 (xembedsniproxy)
# 1. 화면 밖으로 날리지 않고(move 삭제), 투명하게 만듦
windowrulev2 = opacity 0.0 override 0.0 override, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# 2. 크기를 1x1로 줄여서 마우스 간섭 최소화 (이게 핵심)
windowrulev2 = size 1 1, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# 3. 포커스 방지 및 장식 제거
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0
windowrulev2 = noinitialfocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0
windowrulev2 = noshadow, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0
windowrulev2 = noblur, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0
windowrulev2 = noborder, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# HyprEmoji config
source = ~/.config/hypremoji/hypremoji.conf
