general {
    lock_cmd = pidof hyprlock || hyprlock       # 중복 실행 방지
    before_sleep_cmd = loginctl lock-session    # 잠들기 전에 세션 잠금 명령
    # Hyprland 0.55의 Lua parser는 `dpms on` 같은 옛 문자열 문법을 거부합니다.
    # `hl.dsp.dpms(...)` 호출 형식만 동작합니다. lid.sh open 분기에서도 동일.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

    # 🚨 핵심 설정: hyprlock이 완전히 켜지고 잠길 때까지 절전 모드 진입을 시스템 단에서 멱살 잡고 대기시킴
    inhibit_sleep = 3
}

# 1. 10분(600s) 무활동 시 잠금
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 2. 10.5분(630s) 무활동 시 화면 끄기 (화면 보호용, 잠금 직후 끄는 것이 정석)
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 3. 15분(900s) 무활동 시 슬립
listener {
    timeout = 900
    on-timeout = systemctl suspend
}