general {
    lock_cmd = pidof hyprlock || hyprlock                                     # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session && sleep 1                        # lock, then let hyprlock capture+blur+render before sleeping (avoids stale lock screen on resume).
    after_sleep_cmd = ~/.config/hypr/scripts/clamshell.sh resume              # restore the correct monitor state after lid/suspend races.
}

# ============================================================================
# Power-aware idle timeouts.
#   ~/.config/hypr/scripts/on-ac.sh exits 0 when the charger is plugged in.
#     on-timeout = on-ac.sh || <cmd>   -> runs only on battery
#     on-timeout = on-ac.sh && <cmd>   -> runs only while charging
#   on-resume actions are kept unconditional (idempotent: safe in both states,
#   and correct even if power state changed while idle).
#
#   On battery (unchanged):  dim 2.5min, lock 5min, screen off 5.5min, suspend 10min
#   While charging:          dim 5min,   lock 10min, screen off 15min, suspend 30min
# ============================================================================

# turn off keyboard backlight (applies in both power states).
# comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 15
    ignore_inhibit = true
    on-timeout = sh -c "touch /tmp/kbd-osd-suppress && brightnessctl -sd tpacpi::kbd_backlight set 0"
    on-resume  = sh -c "brightnessctl -rd tpacpi::kbd_backlight; (sleep 0.5; rm -f /tmp/kbd-osd-suppress) &"
}

# --- backlight dim -----------------------------------------------------------
listener {                                            # battery: 2.5min
    timeout = 150
    on-timeout = ~/.config/hypr/scripts/on-ac.sh || brightnessctl -s set 10   # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume  = brightnessctl -r                                             # monitor backlight restore.
}
listener {                                            # charging: 5min
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/on-ac.sh && brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# --- lock session ------------------------------------------------------------
listener {                                            # battery: 5min
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/on-ac.sh || loginctl lock-session
}
listener {                                            # charging: 10min
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/on-ac.sh && loginctl lock-session
}

# --- screen off (dpms) -------------------------------------------------------
listener {                                            # battery: 5.5min
    timeout = 330
    on-timeout = ~/.config/hypr/scripts/on-ac.sh || hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}
listener {                                            # charging: 15min
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/on-ac.sh && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# --- suspend -----------------------------------------------------------------
listener {                                            # battery: 10min
    timeout = 600
    on-timeout = ~/.config/hypr/scripts/on-ac.sh || systemctl suspend
}
listener {                                            # charging: 30min
    timeout = 1800
    on-timeout = ~/.config/hypr/scripts/on-ac.sh && systemctl suspend
}
