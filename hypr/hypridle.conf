general {
  lock_cmd = pidof hyprlock >/dev/null || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = bash -c "hyprctl dispatch dpms on; ~/.config/hypr/scripts/lid.sh open; pkill waybar; hyprctl dispatch exec waybar"
}

# 10분(600s) 무활동 시 잠금
listener {
  timeout = 600
  on-timeout = pidof hyprlock >/dev/null || hyprlock
  on-resume = hyprctl dispatch dpms on
}

# 15분(900s) 무활동 시 슬립
listener {
  timeout = 900
  on-timeout = systemctl suspend
}
