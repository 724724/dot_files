context.modules = [
    {
        name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Voice Isolation"
            media.name = "Voice Isolation"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = rnnoise
                        plugin = "librnnoise_ladspa"
                        label = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)" = 45.0
                            "VAD Grace Period (ms)" = 180
                            "Retroactive VAD Grace Period (ms)" = 60
                        }
                    }
                ]
            }
            audio.position = [ MONO ]
            capture.props = {
                node.name = "quickshell_voice_isolation_input"
                node.passive = true
            }
            playback.props = {
                node.name = "quickshell_voice_isolation"
                node.description = "Voice Isolation"
                media.class = Audio/Source
            }
        }
    }
]
