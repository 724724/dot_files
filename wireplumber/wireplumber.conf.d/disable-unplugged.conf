monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3-platform-sof_sdw" }
    ]
    actions = {
      update-props = {
        device.description = "Built-in Audio"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Headset__source" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__HDMI2__sink" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__HDMI3__sink" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { device.name = "alsa_card.platform-snd_aloop.0" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
