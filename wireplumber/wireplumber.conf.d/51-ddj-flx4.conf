# DDJ-FLX4 for Serato DJ Pro under Wine.
#
# Serato opens controller audio in WASAPI EXCLUSIVE mode. Wine's pulse
# backend (winepulse -> pipewire-pulse) rejects exclusive-mode format
# queries, so Wine's audio driver is set to ALSA for the Serato prefix
# (HKCU\Software\Wine\Drivers  Audio=alsa) and PipeWire must release the
# FLX4 card entirely so winealsa can open hw:DDJFLX4 directly.
#
# Side effect: FLX4 audio bypasses PipeWire completely (no resampling,
# no graph quantum) — best latency and no crackle. Desktop audio on the
# internal card is untouched.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-AlphaTheta_Corporation_DDJ-FLX4.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
