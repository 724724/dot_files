# ----------------------------------------------------------------------------
# /etc/tlp.conf - TLP user configuration (version 1.9.1)
# See full explanation: https://linrunner.de/tlp/settings
#
# Optimized for: Lenovo ThinkPad T16 Gen 8 (21TD000LUS)
#   CPU: Intel Core Ultra 7 255H (Arrow Lake-H, intel_pstate)
#   dGPU: NVIDIA GeForce RTX 5060 Max-Q
#   iGPU: Intel Arc Pro 130T/140T
#
# Power Profiles (Windows-style):
#   AC  → High Performance (PRF)
#   BAT → Balanced (BAL)
#   Manual → Power Saver via `sudo tlp power-saver` (SAV)
#
# ----------------------------------------------------------------------------

# --- General ---

TLP_ENABLE=1

# Auto switch: AC→performance, BAT→balanced
# smart(2) = 수동으로 power-saver 전환 시 충전기 꽂아도 유지됨
TLP_AUTO_SWITCH=2

# 전원 감지 실패 시 기본 프로필
TLP_DEFAULT_MODE=BAL

# --- CPU (intel_pstate active mode) ---

# intel_pstate active 모드 사용
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_DRIVER_OPMODE_ON_SAV=active

# 스케일링 거버너
# AC: performance (최대 성능, Windows "High Performance")
# BAT: powersave (효율 우선, Windows "Balanced")
# SAV: powersave (절전)
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave

# EPP (Energy Performance Preference)
# AC: 최대 성능
# BAT: 균형 (Windows Balanced과 동일)
# SAV: 최대 절전
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# P-state 범위 (%)
# AC: 제한 없음 (0~100%)
# BAT: 적당히 제한 (0~80%)
# SAV: 강하게 제한 (0~50%)
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=80
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=50

# 터보 부스트
# AC: 허용 (5.10GHz까지)
# BAT: 허용 (Windows Balanced도 허용함)
# SAV: 비활성화
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

# HWP Dynamic Boost (Intel 6세대+)
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_SAV=0

# --- Platform Profile ---
# ACPI platform profile (팬/발열/성능 통합 제어)
# Windows 전원 관리자의 "시스템 냉각 정책"과 동일
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# --- Disk ---

DISK_DEVICES="nvme0n1"

# NVMe APM
DISK_APM_LEVEL_ON_AC="254"
DISK_APM_LEVEL_ON_BAT="128"

# I/O 스케줄러
DISK_IOSCHED="mq-deadline"

# Dirty page writeback (데이터 손실 vs 절전 균형)
# AC: 자주 쓰기 (안정성 우선)
# BAT: 지연 쓰기 (절전)
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

# Laptop mode (디스크 idle 후 sync 대기)
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2

# AHCI Runtime PM (NVMe/SATA)
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_TIMEOUT=15

# --- GPU (Intel Arc + NVIDIA) ---

# Intel iGPU 주파수는 기본값 유지 (driver가 자동 관리)
# NVIDIA dGPU는 TLP이 아닌 nvidia-powerd / envycontrol로 관리 권장

# --- PCIe ---

# PCIe ASPM: BIOS 기본값 유지 (ThinkPad BIOS가 최적화됨)
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default

# PCIe Runtime PM
# AC: 비활성화 (dGPU 등 고성능 장치 항상 활성)
# BAT: 자동 절전
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# NVIDIA dGPU를 Runtime PM에서 제외하지 않음
# (nvidia-powerd가 별도 관리하므로 TLP 간섭 방지)
RUNTIME_PM_DRIVER_DENYLIST="mei_me"

# --- Wi-Fi ---

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Wake-on-LAN 비활성화 (절전)
WOL_DISABLE=Y

# --- Audio ---

# Intel HDA 절전 (1초 후 절전 진입)
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# --- USB ---

USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=0
USB_EXCLUDE_PHONE=0
USB_EXCLUDE_PRINTER=1

# --- Radio ---

# 시작 시 상태 복원 (이전 종료 시 상태 유지)
RESTORE_DEVICE_STATE_ON_STARTUP=1

# --- Suspend ---

# s2idle: Arrow Lake에서 deep 지원이 불안정할 수 있음
# 안정성 우선으로 s2idle 사용 (Windows Modern Standby와 동일)
MEM_SLEEP_ON_AC=s2idle
MEM_SLEEP_ON_BAT=s2idle

# NMI Watchdog 비활성화 (절전)
NMI_WATCHDOG=0

# --- Battery Care (ThinkPad) ---
# 배터리 수명 연장을 위한 충전 임계값
# 80% 규칙: 20~80% 사이에서 충전하면 배터리 수명 극대화
# ThinkPad은 START/STOP 모두 지원

# BAT0 (내장 배터리)
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80

# AC 분리 시 임계값 복원 (외출 전 100% 충전 필요 시 대비)
# `tlp fullcharge` 명령으로 일시적 100% 충전 가능
RESTORE_THRESHOLDS_ON_BAT=1
