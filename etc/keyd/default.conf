[ids]
*
# Exclude ThinkPad Extra Buttons (Fn-row media keys) so XF86Display (F7)
# stays on its own input device — Hyprland's keyboard-lock script
# disables keyd-virtual-keyboard, and F7 must remain reachable to unlock.
-17aa:5054

[main]
# Remap Caps Lock to F15 by default
capslock = f15
# Set Left Shift to activate a custom layer (lshift) while held
leftshift = layer(lshift)

# Define the custom Left Shift layer, inheriting from standard Shift (:S)
[lshift:S]
# Only in this layer (when Left Shift is held), Caps Lock behaves as Caps Lock
capslock = capslock

