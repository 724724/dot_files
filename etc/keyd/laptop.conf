# /etc/keyd/laptop.conf
# Only grab the main keyboard. ThinkPad Extra Buttons (17aa:5054, the
# Fn-row media/display keys) is intentionally NOT grabbed so that F7
# (KEY_SWITCHVIDEOMODE / XF86Display) remains on its own device, letting
# Hyprland's keyboard-lock script work — the script disables
# keyd-virtual-keyboard, and F7 needs to stay on a separate input device
# to remain reachable for unlock.
[ids]
0001:0001

[main]
capslock = f15
leftshift = layer(lshift)
leftalt = leftmeta
leftmeta = leftalt

[lshift:S]
capslock = capslock
