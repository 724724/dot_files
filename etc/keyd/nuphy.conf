# /etc/keyd/nuphy.conf
# NuPhy Halo65 (Mac 모드 — Apple 벤더 ID 05ac로 인식됨)
# default.conf의 기본 매핑을 유지하면서, Option(Alt)+화살표를
# Fn+화살표(Home/End)처럼 동작하도록 덮어쓴다.
[ids]
05ac:024f

[main]
capslock = f15
leftshift = layer(lshift)

[lshift:S]
capslock = capslock

# Option(Alt)을 누른 상태의 레이어. 여기에 없는 키는 평소처럼 Alt 조합으로 동작.
[alt]
left = home
right = end
# 위/아래도 원하면 주석 해제 (Fn+↑/↓ = PageUp/PageDown)
# up = pageup
# down = pagedown
