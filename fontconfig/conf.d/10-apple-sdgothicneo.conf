<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Apple SD Gothic Neo</family>
      <family>Apple Color Emoji</family> <family>Noto Sans CJK KR</family>  <family>Noto Sans</family>         </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Apple SD Gothic Neo</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test qual="any" name="family"><string>Apple SD 산돌고딕 Neo</string></test>
    <edit name="family" mode="assign" binding="same"><string>Apple SD Gothic Neo</string></edit>
  </match>

</fontconfig>
