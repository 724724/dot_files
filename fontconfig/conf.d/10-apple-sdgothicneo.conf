<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Apple SD Gothic Neo</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Apple SD Gothic Neo</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test qual="any" name="family"><string>Apple SD Gothic Neo</string></test>
    <test name="weight" compare="more"><const>extrabold</const></test>
    <edit name="family" mode="assign" binding="strong"><string>AppleSDGothicNeoH00</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Apple SD Gothic Neo</string></test>
    <test name="weight" compare="eq"><const>extrabold</const></test>
    <edit name="family" mode="assign" binding="strong"><string>AppleSDGothicNeoEB00</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Apple SD Gothic Neo</string></test>
    <test name="weight" compare="eq"><const>bold</const></test>
    <edit name="family" mode="assign" binding="strong"><string>AppleSDGothicNeoB00</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Apple SD Gothic Neo</string></test>
    <test name="weight" compare="eq"><const>demibold</const></test>
    <edit name="family" mode="assign" binding="strong"><string>AppleSDGothicNeoSB00</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Apple SD Gothic Neo</string></test>
    <test name="weight" compare="eq"><const>medium</const></test>
    <edit name="family" mode="assign" binding="strong"><string>AppleSDGothicNeoM00</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Apple SD Gothic Neo</string></test>
    <test name="weight" compare="eq"><const>light</const></test>
    <edit name="family" mode="assign" binding="strong"><string>AppleSDGothicNeoL00</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Apple SD Gothic Neo</string></test>
    <test name="weight" compare="eq"><const>extralight</const></test>
    <edit name="family" mode="assign" binding="strong"><string>AppleSDGothicNeoUL00</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Apple SD Gothic Neo</string></test>
    <test name="weight" compare="eq"><const>thin</const></test>
    <edit name="family" mode="assign" binding="strong"><string>AppleSDGothicNeoT00</string></edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Apple SD Gothic Neo</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AppleSDGothicNeoR00</string></edit>
  </match>

</fontconfig>
