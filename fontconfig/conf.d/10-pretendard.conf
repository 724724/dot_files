<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Pretendard Variable</family>
      <family>Apple Color Emoji</family>
      <family>Noto Sans</family> </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Pretendard Variable</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>

</fontconfig>
